[project]
name = "py-repl-app-mount"
version = "0.1.0"
description = "Interactive bash REPL over a Mesa cloud repo using the Python SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mesa-sdk>=0.29.1",
    "python-dotenv>=1.2.2",
]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python3"

[tool.pyright]
venvPath = "."
venv = ".venv"
